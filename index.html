<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PROJECT MANHUNT — Civilian Night Chase</title>
<style>
html,body{height:100%;overflow:hidden;background:#02050a}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none}
#host{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;text-shadow:0 2px 8px #000}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
.brand{font-weight:900;letter-spacing:2px;font-size:13px}.brand b{color:#ef4444}.sub{font-size:8px;color:#93a4bb;letter-spacing:1.4px}
.time{text-align:center;font:900 26px ui-monospace,monospace}.objective{text-align:center;font-size:8px;letter-spacing:1.2px;color:#cbd5e1}
.right{text-align:right}.status{display:inline-block;margin-top:5px;padding:5px 9px;border:1px solid #22c55e;background:rgba(34,197,94,.14);font-size:9px;font-weight:900;letter-spacing:1.2px}
.status.suspicious{border-color:#f59e0b;background:rgba(245,158,11,.16);color:#fde68a}.status.spotted{border-color:#ef4444;background:rgba(239,68,68,.2);color:#fecaca}
.bottom{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:220px 1fr auto;gap:12px;align-items:end}
.card{background:linear-gradient(90deg,rgba(5,10,18,.92),rgba(5,10,18,.48));padding:9px 11px;border-left:3px solid #3b82f6}
.row{display:flex;justify-content:space-between;font-size:8px;letter-spacing:1.2px;color:#cbd5e1}.track{height:8px;background:#111827;margin-top:6px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#2563eb,#60a5fa)}
#detectTrack{margin-top:7px}.detectFill{height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#ef4444)}
#prompt{text-align:center;font-size:10px;font-weight:900;letter-spacing:1px}
.buttons{display:flex;gap:8px;pointer-events:auto}.btn{width:52px;height:46px;border:1px solid rgba(255,255,255,.16);background:rgba(7,12,20,.85);color:#fff;border-radius:7px;font-weight:900}
#mobile{display:none}.zone{position:fixed;bottom:0;width:50%;height:52vh;z-index:12}.move{left:0}.look{right:0}
.stick{position:fixed;width:108px;height:108px;border-radius:50%;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);display:none;transform:translate(-50%,-50%)}.knob{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(59,130,246,.5);border:1px solid rgba(255,255,255,.5)}
.actions{position:fixed;right:14px;bottom:68px;z-index:14;display:grid;grid-template-columns:repeat(2,68px);gap:8px}.actions button{height:48px;border:1px solid rgba(255,255,255,.18);background:rgba(7,12,20,.8);color:#fff;border-radius:50%;font-size:8px;font-weight:900}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle,rgba(15,23,42,.72),rgba(2,6,12,.97));z-index:30}
.panel{width:min(640px,94vw);padding:30px;text-align:center;border:1px solid rgba(255,255,255,.13);background:linear-gradient(145deg,rgba(15,23,42,.98),rgba(3,7,14,.98))}
.panel h1{font-size:clamp(36px,8vw,70px);line-height:.95}.panel p{max-width:520px;margin:16px auto;color:#aeb8c7;line-height:1.5;font-size:13px}
.primary{border:0;background:#ef4444;color:#fff;font-weight:900;letter-spacing:1.3px;padding:13px 25px}
@media(pointer:coarse),(max-width:900px){#mobile{display:block}.bottom{grid-template-columns:150px 1fr auto}.buttons{position:absolute;right:0;bottom:120px}.brand{font-size:10px}.sub,.objective{display:none}}
</style>
</head>
<body>
<div id="host"></div>
<div id="hud">
  <div class="top">
    <div><div class="brand">PROJECT <b>MANHUNT</b></div><div class="sub">THE BLOCKS · CIVILIAN NIGHT CHASE</div></div>
    <div><div class="time" id="timer">01:30</div><div class="objective">SURVIVE · HIDE · RESCUE</div></div>
    <div class="right"><div id="crew">3 FREE</div><div class="status" id="status">HIDDEN</div></div>
  </div>
  <div class="bottom">
    <div class="card">
      <div class="row"><span>STAMINA</span><span id="stamVal">100</span></div>
      <div class="track"><div class="fill" id="stamFill"></div></div>
      <div class="row" style="margin-top:8px"><span>DETECTION</span><span id="detectVal">0%</span></div>
      <div class="track" id="detectTrack"><div class="detectFill" id="detectFill"></div></div>
    </div>
    <div id="prompt"></div>
    <div class="buttons">
      <button class="btn" id="noiseBtn">📻</button>
      <button class="btn" id="sodaBtn">🥤</button>
    </div>
  </div>
</div>
<div id="mobile">
  <div class="zone move" id="moveZone"><div class="stick" id="stick"><div class="knob" id="knob"></div></div></div>
  <div class="zone look" id="lookZone"></div>
  <div class="actions">
    <button id="sprintBtn">SPRINT</button>
    <button id="crouchBtn">CROUCH</button>
    <button id="rescueBtn">RESCUE</button>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="panel">
    <h1>PROJECT MANHUNT</h1>
    <p>A civilian night chase through The Blocks. Stay out of the Hunter’s flashlight, use shadows and cover, distract them with sound, and rescue your friends.</p>
    <button class="primary" id="startBtn">START GAME</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const host=$('host'),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02050a);scene.fog=new THREE.FogExp2(0x07101a,.022);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,250);
scene.add(new THREE.HemisphereLight(0x6b84b8,0x071018,.7));
const moon=new THREE.DirectionalLight(0x93b4ef,.45);moon.position.set(-25,35,-20);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);

const HALF=38,obstacles=[],occluders=[],streetLights=[];
const mat=(c,r=.85,m=.05)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function box(x,z,w,d,h,c){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));mesh.position.set(x,h/2,z);mesh.castShadow=mesh.receiveShadow=true;scene.add(mesh);obstacles.push({x:x-w/2,z:z-d/2,w,d});occluders.push(mesh);return mesh}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),mat(0x111820,1));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=-3;i<=3;i++){const road=new THREE.Mesh(new THREE.PlaneGeometry(7,84),mat(0x161d26,1));road.rotation.x=-Math.PI/2;road.position.set(i*12,.01,0);scene.add(road)}
[
[-25,-22,14,16,9,0x1b2633],[24,-22,15,16,10,0x202c3b],[-25,22,14,16,8,0x1a2430],[24,22,15,16,11,0x222f40],
[0,-28,10,8,7,0x18222e],[0,28,11,8,12,0x263245],[-8,8,7,10,6,0x202938],[9,-7,8,9,7,0x1d2835]
].forEach(v=>box(...v));
[[-7,-2,.4,12,1.5,0x3a4350],[7,2,.4,12,1.5,0x3a4350],[-15,5,2.3,1.5,1.3,0x2f4a33],[15,-5,2.3,1.5,1.3,0x2f4a33]].forEach(v=>box(...v));

function lightPost(x,z){
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,4.2,8),mat(0x16191f));pole.position.set(x,2.1,z);pole.castShadow=true;scene.add(pole);
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),new THREE.MeshStandardMaterial({color:0xffdf9d,emissive:0xffb84e,emissiveIntensity:2}));bulb.position.set(x,4.1,z);scene.add(bulb);
 const l=new THREE.PointLight(0xffb35c,1.15,16,2);l.position.set(x,4,z);scene.add(l);streetLights.push({x,z,r:8});
}
[[-15,0],[15,0],[0,-15],[0,15],[-28,5],[28,-5],[-10,28],[10,-28]].forEach(p=>lightPost(...p));

const jail={x:0,z:0,r:3.5};const jf=new THREE.Mesh(new THREE.CircleGeometry(jail.r,32),mat(0x1b1507));jf.rotation.x=-Math.PI/2;jf.position.y=.02;scene.add(jf);
for(let i=0;i<18;i++){const a=i/18*Math.PI*2;if(a>.25&&a<.95)continue;const b=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,2.7,6),mat(0x4a505b,.4,.7));b.position.set(Math.cos(a)*jail.r,1.35,Math.sin(a)*jail.r);scene.add(b)}
const jailLight=new THREE.SpotLight(0xffc45a,2.2,15,Math.PI/7,.45);jailLight.position.set(0,8,0);jailLight.target.position.set(0,0,0);scene.add(jailLight,jailLight.target);

function civilian(color,skin=0xd7a374,hair=0x2a1a13){
 const g=new THREE.Group(),cloth=mat(color,.8),dark=mat(0x151820,.9),skinM=mat(skin,.85),hairM=mat(hair,.95);
 const root=new THREE.Group();root.position.y=1;g.add(root);
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.23,.55,4,8),cloth);torso.position.y=.43;torso.castShadow=true;root.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),skinM);head.position.y=.93;head.castShadow=true;root.add(head);
 const hairMesh=new THREE.Mesh(new THREE.SphereGeometry(.205,12,12,0,Math.PI*2,0,Math.PI/2.2),hairM);hairMesh.position.y=.98;root.add(hairMesh);
 const limbs={};
 [['armL',-.31,.68],['armR',.31,.68],['legL',-.13,.1],['legR',.13,.1]].forEach(([n,x,y])=>{const p=new THREE.Group();p.position.set(x,y,0);root.add(p);const h=n.startsWith('arm')?.56:.64;const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(.075,h,3,6),n.startsWith('arm')?cloth:dark);mesh.position.y=-h/2;mesh.castShadow=true;p.add(mesh);limbs[n]=p});
 scene.add(g);return{g,root,limbs,cloth,dark,phase:0}
}
function animate(c,dt,speed,crouch,caught){
 c.phase+=dt*(speed>1?9:5.5)*Math.max(.15,speed);const s=Math.sin(c.phase),amp=crouch?.28:(.18+Math.min(speed,2)*.28);
 c.limbs.armL.rotation.x=s*amp;c.limbs.armR.rotation.x=-s*amp;c.limbs.legL.rotation.x=-s*amp;c.limbs.legR.rotation.x=s*amp;
 c.root.position.y=(crouch?.72:1)+Math.abs(s)*.035;c.root.rotation.x=crouch?.18:Math.min(speed,2)*.045;c.g.scale.y=caught?.85:1
}
function entity(role,color){return{role,char:civilian(color),x:0,z:0,r:.32,facing:0,caught:false,state:'patrol',target:null,lastSeen:null,stateUntil:0,detect:0,speed:0,crouch:false}}

let player=entity('player',0x2563eb),hunter=entity('hunter',0x8b1d2c),mates=[entity('mate',0x1f8f5f),entity('mate',0x2aa66f),entity('mate',0x269c67)];
const entities=[player,hunter,...mates],ROUND=90;
let running=false,startTime=0,last=0,stamina=100,suspicion=0,rescues=0,noises=[],keys={},input={x:0,y:0,sprint:false,crouch:false},camYaw=Math.PI,camPitch=.3;

function blocked(x,z,r){if(Math.abs(x)>HALF-r||Math.abs(z)>HALF-r)return true;for(const o of obstacles){const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cz=Math.max(o.z,Math.min(z,o.z+o.d));if((x-cx)**2+(z-cz)**2<r*r)return true}return false}
function move(e,dx,dz){if(!blocked(e.x+dx,e.z,e.r))e.x+=dx;if(!blocked(e.x,e.z+dz,e.r))e.z+=dz}
function free(avoid=[]){for(let i=0;i<300;i++){const p={x:(Math.random()*2-1)*(HALF-3),z:(Math.random()*2-1)*(HALF-3)};if(!blocked(p.x,p.z,.4)&&avoid.every(a=>Math.hypot(p.x-a.x,p.z-a.z)>8))return p}return{x:0,z:30}}
function rayClear(a,b){
 const dir=new THREE.Vector3(b.x-a.x,1,b.z-a.z),len=Math.hypot(b.x-a.x,b.z-a.z);dir.normalize();
 const ray=new THREE.Raycaster(new THREE.Vector3(a.x,1.1,a.z),dir,0,len);return ray.intersectObjects(occluders,false).length===0
}
function lightingAt(e){let v=.15;for(const l of streetLights){const d=Math.hypot(e.x-l.x,e.z-l.z);if(d<l.r)v=Math.max(v,1-d/l.r)}return v}
function visibilityScore(target){
 const d=Math.hypot(target.x-hunter.x,target.z-hunter.z);if(d>20)return 0;
 const targetAngle=Math.atan2(target.x-hunter.x,target.z-hunter.z),face=hunter.facing*Math.PI/180,diff=Math.abs(Math.atan2(Math.sin(targetAngle-face),Math.cos(targetAngle-face)));
 if(diff>1.25||!rayClear(hunter,target))return 0;
 let score=(1-d/20)*(1-diff/1.25);score*=.45+.75*lightingAt(target);if(target.crouch)score*=.48;if(target.speed>1.2)score*=1.35;return Math.max(0,score)
}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function reset(){
 const ps=free();player.x=ps.x;player.z=ps.z;player.caught=false;mates.forEach(m=>{const p=free([hunter]);m.x=p.x;m.z=p.z;m.caught=false;m.state='roam';m.target=free()});
 const hp=free([player,...mates]);hunter.x=hp.x;hunter.z=hp.z;hunter.state='patrol';hunter.target=free([player]);hunter.lastSeen=null;hunter.stateUntil=0;
 stamina=100;suspicion=0;rescues=0;noises=[];camYaw=Math.PI;running=true;startTime=performance.now();last=startTime;$('overlay').style.display='none';requestAnimationFrame(loop)
}
function updatePlayer(dt){
 let dx=input.x,dy=input.y;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;
 const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}player.crouch=input.crouch||keys.c;const sprint=(input.sprint||keys.shift)&&!player.crouch&&stamina>1&&l>.08,sp=player.crouch?2.2:sprint?7.8:4.5;
 if(l>.08){const fx=Math.sin(camYaw),fz=Math.cos(camYaw),rx=Math.sin(camYaw+Math.PI/2),rz=Math.cos(camYaw+Math.PI/2),mx=fx*(-dy)+rx*dx,mz=fz*(-dy)+rz*dx,ml=Math.hypot(mx,mz)||1;move(player,mx/ml*sp*dt,mz/ml*sp*dt);player.facing=Math.atan2(mx,mz)*180/Math.PI;player.speed=sprint?1.8:player.crouch?.35:.9;if(sprint&&Math.random()<dt*8)noises.push({x:player.x,z:player.z,life:.8,strength:1})}else player.speed=0;
 stamina=sprint?Math.max(0,stamina-24*dt):Math.min(100,stamina+12*dt)
}
function updateMate(m,dt,now){
 if(m.caught){m.speed=0;return}const dh=Math.hypot(m.x-hunter.x,m.z-hunter.z);
 if(dh<11&&rayClear(m,hunter)){const a=Math.atan2(m.x-hunter.x,m.z-hunter.z);m.target={x:m.x+Math.sin(a)*12,z:m.z+Math.cos(a)*12};m.state='flee';m.stateUntil=now+2200}
 else if(!m.target||Math.hypot(m.x-m.target.x,m.z-m.target.z)<1||now>m.stateUntil){m.state='roam';m.target=free([hunter]);m.stateUntil=now+4000+Math.random()*3000}
 const a=Math.atan2(m.target.x-m.x,m.target.z-m.z),sp=m.state==='flee'?5.7:2.8;move(m,Math.sin(a)*sp*dt,Math.cos(a)*sp*dt);m.facing=a*180/Math.PI;m.speed=m.state==='flee'?1.4:.55
}
function updateHunter(dt,now){
 let seen=null,best=0;for(const t of [player,...mates])if(!t.caught){const s=visibilityScore(t);if(s>best){best=s;seen=t}}
 if(seen&&best>.035){suspicion=Math.min(100,suspicion+best*82*dt);hunter.lastSeen={x:seen.x,z:seen.z};if(suspicion>70){hunter.state='chase';hunter.target=seen;hunter.stateUntil=now+1800}else{hunter.state='alert';hunter.target=hunter.lastSeen;hunter.stateUntil=now+1200}}
 else suspicion=Math.max(0,suspicion-(hunter.state==='search'?8:15)*dt);
 if(hunter.state!=='chase'){const heard=noises.find(n=>n.life>0&&Math.hypot(n.x-hunter.x,n.z-hunter.z)<17*n.strength);if(heard){hunter.state='investigate';hunter.target={x:heard.x,z:heard.z};hunter.stateUntil=now+2600;heard.life=0}}
 if((hunter.state==='chase'||hunter.state==='alert')&&seen==null&&now>hunter.stateUntil){hunter.state='search';hunter.target=hunter.lastSeen||free();hunter.stateUntil=now+3500}
 if(hunter.state==='search'&&now>hunter.stateUntil){hunter.state='patrol';hunter.target=free([player])}
 if(!hunter.target||Math.hypot(hunter.x-hunter.target.x,hunter.z-hunter.target.z)<1){if(hunter.state==='patrol')hunter.target=free([player]);else if(hunter.state==='search')hunter.target={x:(hunter.lastSeen?.x||hunter.x)+(Math.random()*8-4),z:(hunter.lastSeen?.z||hunter.z)+(Math.random()*8-4)}}
 const a=Math.atan2(hunter.target.x-hunter.x,hunter.target.z-hunter.z),sp=hunter.state==='chase'?6.1:hunter.state==='alert'?4.7:hunter.state==='investigate'?4.1:3;move(hunter,Math.sin(a)*sp*dt,Math.cos(a)*sp*dt);hunter.facing=a*180/Math.PI;hunter.speed=hunter.state==='chase'?1.6:.7;
 for(const t of [player,...mates])if(!t.caught&&Math.hypot(t.x-hunter.x,t.z-hunter.z)<.85){if(t===player){running=false;$('overlay').style.display='flex';$('overlay').querySelector('h1').textContent='CAUGHT';$('overlay').querySelector('p').textContent='The Hunter tracked you down.'}else{t.caught=true;t.x=jail.x+(Math.random()*2-1)*1.4;t.z=jail.z+(Math.random()*2-1)*1.4}}
}
function updateCamera(dt){
 const dist=5.6,ox=Math.sin(camYaw)*dist*Math.cos(camPitch),oz=Math.cos(camYaw)*dist*Math.cos(camPitch),oy=2.2+Math.sin(camPitch)*dist,desired=new THREE.Vector3(player.x+ox,oy,player.z+oz);if(blocked(desired.x,desired.z,.4)){desired.x=player.x+ox*.35;desired.z=player.z+oz*.35}camera.position.lerp(desired,Math.min(1,dt*7));camera.lookAt(player.x,1.15,player.z)
}
function flashlight(){
 if(!hunter.flash){const cone=new THREE.Mesh(new THREE.ConeGeometry(5,14,32,1,true),new THREE.MeshBasicMaterial({color:0xffe0a3,transparent:true,opacity:.08,side:THREE.DoubleSide,depthWrite:false}));cone.rotation.x=Math.PI/2;hunter.char.g.add(cone);cone.position.set(0,1,-7);hunter.flash=cone}
}
flashlight();
function loop(now){
 if(!running)return;const dt=Math.min(.04,(now-last)/1000);last=now;const elapsed=(now-startTime)/1000;
 updatePlayer(dt);mates.forEach(m=>updateMate(m,dt,now));updateHunter(dt,now);noises.forEach(n=>n.life-=dt);noises=noises.filter(n=>n.life>0);updateCamera(dt);
 entities.forEach(e=>{animate(e.char,dt,e.speed,e.crouch,e.caught);e.char.g.position.set(e.x,0,e.z);e.char.g.rotation.y+=(e.facing*Math.PI/180-e.char.g.rotation.y)*Math.min(1,dt*9)});
 $('timer').textContent=fmt(ROUND-elapsed);$('stamFill').style.width=stamina+'%';$('stamVal').textContent=Math.round(stamina);$('detectFill').style.width=suspicion+'%';$('detectVal').textContent=Math.round(suspicion)+'%';
 const free=mates.filter(m=>!m.caught).length;$('crew').textContent=free+' FREE · '+(mates.length-free)+' CAUGHT';const status=suspicion>70?'SPOTTED':suspicion>10?'SUSPICIOUS':'HIDDEN';$('status').textContent=status;$('status').className='status '+(status==='SPOTTED'?'spotted':status==='SUSPICIOUS'?'suspicious':'');
 $('prompt').textContent=Math.hypot(player.x-jail.x,player.z-jail.z)<4.5&&mates.some(m=>m.caught)?'PRESS RESCUE TO FREE YOUR FRIENDS':'';
 if(elapsed>=ROUND){running=false;$('overlay').style.display='flex';$('overlay').querySelector('h1').textContent='YOU SURVIVED';$('overlay').querySelector('p').textContent='You escaped the Hunter and survived the night.';return}
 requestAnimationFrame(loop)
}
function rescue(){if(Math.hypot(player.x-jail.x,player.z-jail.z)>4.5)return;mates.filter(m=>m.caught).forEach(m=>{m.caught=false;const p=free([hunter]);m.x=p.x;m.z=p.z;rescues++})}
$('startBtn').onclick=reset;$('noiseBtn').onclick=()=>noises.push({x:player.x,z:player.z,life:4,strength:2.2});$('sodaBtn').onclick=()=>stamina=100;$('rescueBtn').onclick=rescue;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')rescue();if(e.key.toLowerCase()==='q')noises.push({x:player.x,z:player.z,life:4,strength:2.2})});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let mp=null,o={x:0,y:0};$('moveZone').onpointerdown=e=>{mp=e.pointerId;o={x:e.clientX,y:e.clientY};$('stick').style.display='block';$('stick').style.left=e.clientX+'px';$('stick').style.top=e.clientY+'px'};$('moveZone').onpointermove=e=>{if(e.pointerId!==mp)return;let dx=e.clientX-o.x,dy=e.clientY-o.y,d=Math.hypot(dx,dy),m=50;if(d>m){dx=dx/d*m;dy=dy/d*m}input.x=dx/m;input.y=dy/m;$('knob').style.left=54+dx+'px';$('knob').style.top=54+dy+'px'};function mr(){mp=null;input.x=input.y=0;$('stick').style.display='none'}$('moveZone').onpointerup=mr;$('moveZone').onpointercancel=mr;
let lp=null,ll={x:0,y:0};$('lookZone').onpointerdown=e=>{lp=e.pointerId;ll={x:e.clientX,y:e.clientY}};$('lookZone').onpointermove=e=>{if(e.pointerId!==lp)return;camYaw-=(e.clientX-ll.x)*.006;camPitch=Math.max(.05,Math.min(.85,camPitch-(e.clientY-ll.y)*.004));ll={x:e.clientX,y:e.clientY}};$('lookZone').onpointerup=()=>lp=null;
function hold(b,on,off){b.onpointerdown=on;b.onpointerup=off;b.onpointercancel=off}hold($('sprintBtn'),()=>input.sprint=true,()=>input.sprint=false);$('crouchBtn').onclick=()=>input.crouch=!input.crouch;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
(function render(){renderer.render(scene,camera);requestAnimationFrame(render)})();
})();

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=00000000000000000000000000000000
ProjectName=PROJECT MANHUNT
ProjectVersion=0.1.0
CompanyName=Vintage Street Games
Description=Photorealistic third-person NYC stealth-chase vertical slice. See /docs at the repo root.

; ---------------------------------------------------------------------------
; Default GameMode. AManhuntGameMode also sets DefaultPawnClass /
; PlayerControllerClass / GameStateClass in its constructor, but the map
; needs a default GameMode override too until a level Blueprint/World
; Settings actor sets one per-map (recommended once the real NYC level
; exists, per /docs/NYC_LEVEL_DESIGN.md).
; ---------------------------------------------------------------------------
[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/ProjectManhunt.ManhuntGameMode
; EditorStartupMap / GameDefaultMap intentionally left unset -- no level
; exists in this scaffold yet. Set both once a vertical-slice map (e.g.
; /Game/Maps/VerticalSlice/VerticalSlice) is created, per
; /docs/NYC_LEVEL_DESIGN.md.

; ---------------------------------------------------------------------------
; Rendering: Lumen + Nanite by default, matching
; /docs/UNREAL_MIGRATION_PLAN.md Section 6 ("what photorealistic requires
; from the engine") and /docs/NYC_LEVEL_DESIGN.md Section 6/8. Validate
; against the confirmed demo hardware per NYC_LEVEL_DESIGN.md Section 8 --
; these are starting values, not a locked scalability tier.
; ---------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.Nanite=True
r.Nanite.ProjectEnabled=True
r.VolumetricFog=True
r.SupportSkyAtmosphere=True
r.MotionBlurQuality=4
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.AmbientOcclusion.Method=1
r.ScreenPercentage=100
r.ShadowQuality=5

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

; ---------------------------------------------------------------------------
; Navigation: the Hunter's NavMesh must NOT cover rooftops -- see
; /docs/HUNTER_AI_SPEC.md Section 6. RecastNavMesh-Default's generation
; bounds/exclusion volumes are level content (a NavMeshBoundsVolume +
; excluded rooftop areas), not something expressible in this ini file --
; flagged here as a required in-editor setup step, not forgotten.
; ---------------------------------------------------------------------------
[/Script/NavigationSystem.NavigationSystemV1]
bAutoRebuildNavigation=True

